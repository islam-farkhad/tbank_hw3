syntax = "proto3";

package flight.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/money.proto";

option go_package = "flight-booking-proto/gen/flight/v1;flightv1";
option csharp_namespace = "FlightBooking.Flight.V1";

// Нарушения правил buf.validate сервер возвращает как INVALID_ARGUMENT.
service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  // NOT_FOUND - рейс с указанным flight_id не существует.
  rpc GetFlight(GetFlightRequest) returns (GetFlightResponse);
  // NOT_FOUND - рейс с указанным flight_id не существует.
  // RESOURCE_EXHAUSTED - доступных мест меньше, чем запрошено в seat_count.
  // FAILED_PRECONDITION - статус рейса не SCHEDULED либо бронирование этого
  // booking_id уже RELEASED или EXPIRED и не может быть активирована повторно.
  // ALREADY_EXISTS - для бронирования с таким booking_id уже существует
  // резервация с другим рейсом или количеством мест.
  // Повтор с теми же параметрами возвращает существующую ACTIVE резервацию
  // без повторного списания мест.
  rpc ReserveSeats(ReserveSeatsRequest) returns (ReserveSeatsResponse);
  // NOT_FOUND — бронирования для указанного booking_id не существует.
  // Для RELEASED/EXPIRED возвращает текущее состояние без повторного
  // увеличения количества доступных мест.
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  FLIGHT_STATUS_SCHEDULED = 1;
  FLIGHT_STATUS_DEPARTED = 2;
  FLIGHT_STATUS_CANCELLED = 3;
  FLIGHT_STATUS_COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_RELEASED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}

message Flight {
  int64 id = 1;
  string flight_number = 2;
  string airline_code = 3;
  string airline_name = 4;
  string origin = 5;
  string destination = 6;
  google.protobuf.Timestamp departure_at = 7;
  google.protobuf.Timestamp arrival_at = 8;
  int32 total_seats = 9;
  int32 available_seats = 10;
  google.type.Money price = 11;
  FlightStatus status = 12;
}

message SeatReservation {
  int64 id = 1;
  int64 flight_id = 2;
  string booking_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SearchFlightsRequest {
  option (buf.validate.message).cel = {
    id: "search_flights.different_airports"
    message: "origin and destination must differ"
    expression: "this.origin != this.destination"
  };

  string origin = 1 [(buf.validate.field).string.pattern = "^[A-Z]{3}$"];
  string destination = 2 [(buf.validate.field).string.pattern = "^[A-Z]{3}$"];
  // Отсутствие поля означает поиск по всем датам.
  // TODO: для календарного фильтра лучше подходит google.type.Date, без времени и часового пояса.
  // Однако в ТЗ указано:«Timestamp для дат».
  google.protobuf.Timestamp date = 3;
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  int64 flight_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetFlightResponse {
  Flight flight = 1;
}

message ReserveSeatsRequest {
  int64 flight_id = 1 [(buf.validate.field).int64.gt = 0];
  int32 seat_count = 2 [(buf.validate.field).int32.gt = 0];
  string booking_id = 3 [(buf.validate.field).string = {
    uuid: true
    not_in: ["00000000-0000-0000-0000-000000000000"]
  }];
}

message ReserveSeatsResponse {
  SeatReservation reservation = 1;
}

message ReleaseReservationRequest {
  string booking_id = 1 [(buf.validate.field).string = {
    uuid: true
    not_in: ["00000000-0000-0000-0000-000000000000"]
  }];
}

message ReleaseReservationResponse {
  SeatReservation reservation = 1;
}
